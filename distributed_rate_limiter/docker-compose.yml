version: "3.8"

services:
  redis:
    image: "redis:alpine"
    container_name: "redis"
    ports:
      - "6379:6379"
    networks:
      - distributed-system
    

  django1:
    build:
      context: .
    container_name: "django1"
    command: sh -c "python manage.py migrate --no-input && gunicorn distributed_rate_limiter.wsgi --bind 0.0.0.0:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - distributed-system
  
  django2:
    build:
      context: .
    container_name: "django2"
    command: sh -c "python manage.py migrate --no-input && gunicorn distributed_rate_limiter.wsgi --bind 0.0.0.0:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - distributed-system
  
  django3:
    build:
      context: .
    container_name: "django3"
    command: sh -c "python manage.py migrate --no-input && gunicorn distributed_rate_limiter.wsgi --bind 0.0.0.0:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - distributed-system

  nginx:
    build:
      context: ./nginx
    container_name: nginx_cont
    ports:
      - "80:80"
    depends_on:
      - django1
      - django2
      - django3
    networks:
      - distributed-system
    restart: always

networks:
  distributed-system:
    driver: bridge